[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tenancy"
version = "0.1.0"
description = "Keep tenant routing out of the model: generated, provenance-stamped tenant bindings + structurally-scoped capabilities for agent runtimes. The model sees content-only operations; deterministic code owns resource routing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Kai Karlstrom" }]
keywords = ["agents", "multi-tenant", "llm", "agent-infrastructure", "isolation", "registry", "capability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kkrlstrm/agent-tenancy"
Repository = "https://github.com/kkrlstrm/agent-tenancy"

[project.scripts]
tenancy = "agent_tenancy.cli:main"

[tool.setuptools]
packages = ["agent_tenancy", "agent_tenancy.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
